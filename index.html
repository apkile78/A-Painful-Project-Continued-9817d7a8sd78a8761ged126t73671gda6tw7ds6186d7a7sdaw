<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navigator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topBar">
    <input id="urlInput" placeholder="Enter URL...">
    <button id="goBtn">Go</button>
    <button id="saveBtn">Save</button>
    <button id="openBtn">Menu</button>

    <button id="clckBtn">popt</button>
    <button id="vtprBtn">vew</button>

    <button id="abtBtn" class="active">abt:blnk</button>
    <button id="blbBtn">blb</button>

    <div class="group-gap"></div>

    <button class="modeBtn active" data-mode="iframe">iframe</button>
    <button class="modeBtn" data-mode="object">js</button>
    <button class="modeBtn" data-mode="embed">embed</button>
</div>

<div id="autocomplete"></div>

<div id="searchContainer">
    <button id="closeBtn">Close</button>
    <button id="hdeBtn">hde</button>

    <!-- ⭐ Added DPS toggle button -->
    <button id="toggleDPS">DPS: OFF</button>

    <h3>Saved Sites</h3>
    <div id="savedSites"></div>
</div>

<div id="viewer"></div>

<button id="mnuReveal">mnu</button>

<!-- ⭐ Added plugin scripts -->
<script src="enemyHealthEstimator.js"></script>
<script src="enemyTracker.js"></script>
<script src="dpsEngine.js"></script>
<script src="ocr.js"></script>
<script src="dps.js"></script>
<script src="pluginHost.js"></script>
<script src="pluginInjector.js"></script>

<!-- Existing scripts -->
<script src="siteDB.js"></script>
<script src="core.js"></script>
<script src="menu.js"></script>
<script src="autocomplete.js"></script>
<script src="main.js"></script>

</body>
</html>
